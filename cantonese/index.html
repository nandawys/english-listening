<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>粤语课归档</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#666;--card:#f7f7f8;--bd:#ddd;--acc:#2f6fed;--acc2:#0a7a3e;--warn:#b54708;--chip:#eef3ff}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--muted:#aaa;--card:#1a1a1a;--bd:#333;--acc:#6ea8fe;--acc2:#3ecf8e;--warn:#ffb86b;--chip:#1e2a44}}
*{box-sizing:border-box}body{font-family:-apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;max-width:680px;margin:0 auto;padding:20px 16px 48px;line-height:1.65;background:var(--bg);color:var(--fg)}
a{color:var(--acc)}h1{font-size:1.55rem;margin:8px 0 6px}h2{font-size:1.2rem;margin:22px 0 10px}h3{font-size:1.05rem;margin:16px 0 8px}
.muted{color:var(--muted);font-size:.95rem}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.nav a,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;text-decoration:none;color:inherit;background:var(--card);font-size:15px;min-height:44px;cursor:pointer}
.nav a.primary,.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.card{border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0;background:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tone{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:520px){.tone{grid-template-columns:1fr 1fr}}
.item{border:1px solid var(--bd);border-radius:14px;padding:12px;background:var(--bg)}
.char{font-size:1.7rem;font-weight:700;line-height:1.2}
.jp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc);font-size:1.05rem}
.mean{color:var(--muted);font-size:.92rem}
.play{background:var(--acc);color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:600;min-height:44px;cursor:pointer}
.play.alt{background:var(--acc2)}
.play.ghost{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--chip);font-size:.82rem;margin-right:4px}
.practice{border:1px dashed var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.reveal{display:none;margin-top:8px;padding:10px;border-radius:10px;background:var(--chip)}
.reveal.show{display:block}
ul.tight{padding-left:1.2em;margin:8px 0}ul.tight li{margin:4px 0}
.footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--bd);color:var(--muted);font-size:.9rem}
.home-link{display:block;padding:16px;margin:12px 0;border:1px solid var(--bd);border-radius:12px;text-decoration:none;color:inherit;font-size:17px;background:var(--card)}
.badge{font-size:.8rem;color:var(--warn);font-weight:600}
</style>
</head>
<body>

<script>
const AU={};
function playJp(jp, btn){
  const url='https://words.hk/static/jyutping/'+jp+'.mp3';
  try{ if(AU[jp]){ AU[jp].pause(); AU[jp].currentTime=0; } }catch(e){}
  const a=new Audio(url); AU[jp]=a;
  if(btn){ const old=btn.textContent; btn.textContent='播放中…'; btn.disabled=true;
    a.onended=a.onerror=()=>{btn.textContent=old; btn.disabled=false;};
  }
  a.play().catch(()=>{ if(btn){btn.textContent='播放失败'; setTimeout(()=>{btn.textContent=old;btn.disabled=false;},1200);} });
}
function toggleReveal(id){ const el=document.getElementById(id); if(el) el.classList.toggle('show'); }
</script>

</body>
</html>
